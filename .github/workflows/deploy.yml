name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install --platform=linux --arch=x64 sharp@0.32.6 --save

      - name: Verify Sharp Installation
        run: |
          node -e "require('sharp')"
          echo "Sharp is installed and ready to use"

      - name: Build
        run: |
          rm -rf .astro dist
          npm run build

      - name: Validate build output
        run: |
          # Check for symlinks or hard links
          find dist -type l && echo "Symlinks detected!" && exit 1
          echo "No symlinks detected"
          du -sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4